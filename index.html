<title>The Things I Carry</title>

<style>
/* Layout: one full-screen dusk world drawn on canvas, a status line on top, and a story sheet anchored at the bottom. Committed single dark world. */
:root {
  --night: #120f2b;
  --ink: #efe8f7;
  --muted: #b6aecd;
  --amber: #f2b766;
  --gold: #e9c46a;
  --sheet: rgba(17, 14, 38, 0.88);
  --line: rgba(233, 196, 106, 0.22);
  --chip: rgba(255, 255, 255, 0.06);
  --map: #8fb8ff;
  --ember: #ff9a5a;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Karla", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --track: .1em;
  --lh: 1.5;
  color-scheme: dark;
}
:root[lang="ar"] {
  --display: "Amiri", "Geeza Pro", "Times New Roman", serif;
  --body: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --track: 0;
  --lh: 1.75;
}
html { box-sizing: border-box; height: 100%; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: var(--lh); overflow: hidden; -webkit-tap-highlight-color: transparent; }

#app { position: relative; height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#hud { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 8px; max-width: 560px; width: 100%; margin-inline: auto; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
.stat { display: flex; align-items: center; gap: 7px; }
.pips { display: flex; gap: 3px; }
.pip { width: 7px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.14); transition: background .3s; }
.pip.on { background: var(--amber); }
.pips.pack .pip.on { background: var(--muted); }
.pips.pack.heavy .pip.on { background: var(--ember); }
.stat b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.inv { display: flex; gap: 6px; flex-wrap: wrap; }
.inv button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(17,14,38,.6); color: var(--tint, var(--gold)); display: grid; place-items: center; cursor: pointer; padding: 0; }
.inv button svg { width: 18px; height: 18px; }

.spacer { flex: 1; min-height: 120px; }

#panel { position: relative; z-index: 2; max-width: 560px; width: 100%; margin-inline: auto; max-height: 56%; overflow-y: auto; cursor: default; background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 40px rgba(0,0,0,.35); }
#panel.enter > * { animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#panel p { margin: 0; color: var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: calc(var(--track) * 1.4); text-transform: uppercase; color: var(--gold) !important; }
:root[lang="ar"] .eyebrow { font-size: 13.5px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(44px, 12vw, 64px); }
h2 { font-size: 32px; }
:root[lang="ar"] h1 { font-size: clamp(40px, 11vw, 56px); line-height: 1.3; font-weight: 700; }
:root[lang="ar"] h2 { font-size: 29px; line-height: 1.35; font-weight: 700; }
.tagline { font-family: var(--display); font-style: italic; font-size: 21px; color: var(--muted) !important; }
blockquote { margin: 4px 0; padding-block: 2px; padding-inline-start: 14px; border-inline-start: 2px solid var(--gold); font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.35; color: var(--ink); }
blockquote.big { font-size: 27px; border: 0; padding: 4px 0; }
:root[lang="ar"] .tagline, :root[lang="ar"] blockquote, :root[lang="ar"] .sign { font-style: normal; line-height: 1.7; }
.note { font-size: 13.5px; color: var(--muted) !important; }
.beat p, .beat blockquote { font-size: 18px; }
.beat blockquote { font-size: 23px; }
.next-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.dots { display: flex; gap: 5px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.18); }
.dots span.on { background: var(--gold); }
.next { display: inline-flex; align-items: center; gap: 4px; padding: 10px 14px 10px 18px; border-radius: 999px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font: inherit; font-weight: 700; cursor: pointer; }
.next svg { width: 18px; height: 18px; }
:root[dir="rtl"] .next svg { transform: scaleX(-1); }
:root[dir="rtl"] .next { padding: 10px 18px 10px 14px; }
.chat > .bubble, .chat > .sys { animation: rise .45s ease both; }

.langs { display: flex; flex-wrap: wrap; gap: 6px; }
.langs button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.langs button[lang="ar"] { font-family: "IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif; }
.langs button[lang="en"], .langs button[lang="es"] { font-family: "Karla", system-ui, sans-serif; }
.langs button.sel { background: var(--gold); border-color: var(--gold); color: #2a1a10; font-weight: 700; }

.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.choices:empty { display: none; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: inherit; cursor: pointer; transition: background .2s, border-color .2s, transform .1s; }
.choice:hover:not(:disabled) { background: rgba(233,196,106,.1); border-color: rgba(233,196,106,.45); }
.choice:active:not(:disabled) { transform: scale(.99); }
.choice:disabled { opacity: .42; cursor: default; }
.choice.primary { background: var(--amber); border-color: var(--amber); color: #2a1a10; align-items: center; font-weight: 700; }
.choice.primary:hover:not(:disabled) { background: var(--gold); }
.c-label { font-weight: 500; }
.c-sub { font-size: 13.5px; color: var(--muted); }
.c-cost { font-size: 12px; color: var(--amber); font-variant-numeric: tabular-nums; unicode-bidi: plaintext; }
.c-cost em { font-style: normal; color: var(--ember); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.items { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.item { display: flex; gap: 10px; align-items: center; text-align: start; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: inherit; cursor: pointer; min-width: 0; }
.item .ico { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--tint); background: rgba(255,255,255,.04); box-shadow: 0 0 18px -4px var(--tint); }
.item .ico svg { width: 20px; height: 20px; }
.item b { display: block; font-weight: 500; font-size: 14px; line-height: 1.3; }
.item small { display: block; font-size: 12px; color: var(--muted); }
.item.got { opacity: .5; cursor: default; }
.item.got .ico { box-shadow: none; }

.stones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; }
.stone { height: 58px; border-radius: 12px; border: 1px solid rgba(143,184,255,.3); background: rgba(143,184,255,.06); color: var(--map); font: 600 20px var(--mono); cursor: pointer; transition: background .15s, box-shadow .15s; }
.stone.lit { background: rgba(143,184,255,.45); color: #0e1430; box-shadow: 0 0 22px rgba(143,184,255,.6); }
.stone.bad { background: rgba(255,154,90,.35); }
.stone:disabled { cursor: default; }
.puz-status { font-size: 13.5px; color: var(--muted) !important; min-height: 1.5em; }

.sparks { display: flex; justify-content: space-around; gap: 8px; padding: 6px 0; }
.spark { width: 68px; height: 68px; border-radius: 50%; border: 1px solid rgba(242,210,122,.35); background: radial-gradient(circle, rgba(242,210,122,.85) 0 14%, rgba(242,210,122,.18) 40%, transparent 70%); cursor: pointer; animation: flicker 2.4s ease-in-out infinite; }
.spark:nth-child(2) { animation-delay: -.8s; } .spark:nth-child(3) { animation-delay: -1.6s; }
.spark:disabled { opacity: .2; animation: none; cursor: default; }
@keyframes flicker { 50% { transform: scale(.9); opacity: .75; } }

.chat { display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 85%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; }
:root[lang="ar"] .bubble { line-height: 1.65; }
.bubble.her { align-self: flex-start; background: rgba(233,196,106,.14); border: 1px solid rgba(233,196,106,.25); border-end-start-radius: 4px; }
.bubble.me { align-self: flex-end; background: rgba(143,184,255,.14); border: 1px solid rgba(143,184,255,.25); border-end-end-radius: 4px; }
.sys { align-self: center; font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; }
.chat-head { font-size: 12px; letter-spacing: calc(var(--track) * 1.4); text-transform: uppercase; color: var(--muted); align-self: center; }

.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tally div { padding: 10px; border-radius: 12px; background: var(--chip); border: 1px solid var(--line); text-align: center; min-width: 0; }
.tally b { display: block; font-family: var(--display); font-size: 30px; font-weight: 400; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.tally span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; margin-top: 4px; }

.letter { font-family: var(--display); font-size: 21px; line-height: 1.45; color: var(--ink) !important; }
:root[lang="ar"] .letter { line-height: 1.8; }
.sign { font-family: var(--display); font-style: italic; font-size: 21px; color: var(--gold) !important; text-align: end; }
.familiar { display: flex; flex-wrap: wrap; gap: 6px; }
.familiar button { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.familiar button.sel { background: var(--gold); color: #2a1a10; border-color: var(--gold); }
.sendrow { display: flex; gap: 8px; align-items: stretch; }
.sendrow input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--ink); font: inherit; font-size: 14px; }
.sendrow button { padding: 0 14px; border-radius: 10px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font: inherit; font-weight: 700; cursor: pointer; }

#sheet { position: fixed; inset: 0; z-index: 5; background: rgba(5,4,14,.6); display: flex; align-items: flex-end; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#sheet .card { max-width: 560px; width: 100%; background: #1a1636; border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
#sheet .card h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
#sheet .card p { margin: 0; }

@media (prefers-reduced-motion: reduce) {
  #panel.enter > *, .spark { animation: none; }
}
</style>

<div id="app">
  <canvas id="world" aria-hidden="true"></canvas>
  <header id="hud" hidden>
    <div class="stats">
      <span class="stat"><span id="lbEnergy"></span> <span class="pips" id="energyPips"></span></span>
      <span class="stat"><span id="lbPack"></span> <span class="pips pack" id="packPips"></span></span>
      <span class="stat" id="timeStat"><span id="lbTime"></span> <b id="timeVal"></b></span>
    </div>
    <div class="inv" id="inv"></div>
  </header>
  <div class="spacer"></div>
  <section id="panel" aria-live="polite"></section>
</div>
<div id="sheet" hidden></div>

/* ---------- State ---------- */
let S;
function resetState() {
  S = {
    energy: 10, maxE: 10, time: 0, maxT: 0,
    carried: { laptop: false, lantern: false, ember: false, thread: false, clock: false },
    ground: [], shelter: [], setDown: 0, rested: 0,
    comms: 0, connection: 2, promise: false, promiseKept: false,
    progress: 0, craft: 0, customers: 0, bridge: null,
    lanternFade: 0, herX: null, walking: false, fromHer: 0
  };
}
resetState();
const burden = () => Object.keys(S.carried).reduce((n, k) => n + (S.carried[k] ? ITEMS[k].w : 0), 0);
const heavy = () => burden() >= 5;
const ecost = base => base + (heavy() ? 1 : 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cost = (base, t) => L.cost(ecost(base), heavy(), t);
function giveE(n) { const before = S.energy; S.energy = Math.min(S.maxE, S.energy + n); S.fromHer += S.energy - before; }
function spend(e, t) { S.energy = clamp(S.energy - e, 0, S.maxE); S.time = Math.max(0, S.time - (t || 0)); }
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- UI helpers ---------- */
const panel = document.getElementById("panel");
const hud = document.getElementById("hud");
const sheet = document.getElementById("sheet");

let viewToken = 0;
function view({ eyebrow, title, big, tagline, body = [], html = "", quote, bigQuote, note, choices = [], reveal }) {
  const token = ++viewToken;
  let head = "";
  if (eyebrow) head += `<p class="eyebrow">${eyebrow}</p>`;
  if (big) head += `<h1>${big}</h1>`;
  if (title) head += `<h2>${title}</h2>`;
  if (tagline) head += `<p class="tagline">${tagline}</p>`;
  const beats = body.map(p => `<p>${p}</p>`);
  if (quote) beats.push(`<blockquote>${quote}</blockquote>`);
  let tail = html;
  if (bigQuote) tail += `<blockquote class="big">${bigQuote}</blockquote>`;
  if (note) tail += `<p class="note">${note}</p>`;
  tail += `<div class="choices">` + choices.map((c, i) =>
    `<button class="choice${c.primary ? " primary" : ""}" data-i="${i}"${c.disabled ? " disabled" : ""}>` +
    `<span class="c-label">${c.label}</span>` +
    (c.sub && (c.keep || c.disabled) ? `<span class="c-sub">${c.sub}</span>` : "") +
    (c.cost ? `<span class="c-cost">${c.cost}</span>` : "") + `</button>`).join("") + `</div>`;

  const animate = () => { panel.scrollTop = 0; panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter"); };
  const bindChoices = () => panel.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    const c = choices[+b.dataset.i];
    if (!c.disabled) c.onPick();
  });
  const dots = i => `<span class="dots">${beats.map((_, j) => `<span class="${j <= i ? "on" : ""}"></span>`).join("")}</span>`;

  if (beats.length <= 1 || big) {
    panel.onclick = null;
    panel.innerHTML = head + beats.join("") + tail;
    bindChoices(); animate();
  } else {
    let i = 0;
    const show = () => {
      if (token !== viewToken) return;
      const last = i === beats.length - 1;
      panel.innerHTML = head + `<div class="beat">${beats[i]}</div>` +
        (last ? tail : `<div class="next-row">${dots(i)}<button class="next">${L.next}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`);
      if (last) { panel.onclick = null; bindChoices(); }
      else panel.onclick = () => { i++; show(); };
      animate();
    };
    show();
  }
  if (reveal) {
    const later = [...panel.querySelectorAll(".chat > .bubble, .chat > .sys")].slice(1);
    const ch = panel.querySelector(".choices");
    later.forEach(e => e.hidden = true);
    if (ch) ch.hidden = true;
    const gap = reduced ? 300 : 1000;
    [...later, ch].filter(Boolean).forEach((e, k) => setTimeout(() => { if (token === viewToken) e.hidden = false; }, gap * (k + 1)));
  }
  updateHUD();
}
function outcome({ eyebrow, title, body, note, then, label }) {
  view({ eyebrow, title, body, note, choices: [{ label: label || L.cont, primary: true, onPick: () => proceed(then) }] });
}
function proceed(fn) {
  if (S.energy <= 0) {
    S.rested++;
    const her = S.connection >= 3;
    if (her) { S.energy = 0; giveE(5); } else S.energy = 3;
    view({ eyebrow: L.oeEyebrow, title: her ? L.oeHerTitle : L.oeTitle, body: her ? [L.oeBody, L.oeHerBody] : [L.oeBody], note: L.plusE(her ? 5 : 3),
      choices: [{ label: L.getUp, primary: true, onPick: fn }] });
  } else fn();
}
function updateHUD() {
  hud.hidden = scene === "title";
  const ep = document.getElementById("energyPips");
  ep.innerHTML = Array.from({ length: S.maxE }, (_, i) => `<span class="pip${i < S.energy ? " on" : ""}"></span>`).join("");
  ep.setAttribute("aria-label", `${S.energy} / ${S.maxE}`);
  const b = burden();
  const pp = document.getElementById("packPips");
  pp.innerHTML = Array.from({ length: 6 }, (_, i) => `<span class="pip${i < b ? " on" : ""}"></span>`).join("");
  pp.classList.toggle("heavy", heavy());
  pp.setAttribute("aria-label", `${b} / 6`);
  document.getElementById("timeStat").hidden = !S.maxT;
  document.getElementById("timeVal").textContent = `${S.time} / ${S.maxT}`;
  const inv = document.getElementById("inv");
  const keys = Object.keys(S.carried).filter(k => S.carried[k]);
  inv.innerHTML = keys.map(k => `<button style="--tint:${TINT[k]}" data-k="${k}" aria-label="${L.items[k].name}">${ICON[k]}</button>`).join("");
  inv.querySelectorAll("button").forEach(b => b.onclick = () => openItem(b.dataset.k));
}
function openItem(k) {
  const it = L.items[k];
  sheet.innerHTML = `<div class="card" role="dialog" aria-label="${it.name}"><p class="eyebrow">${L.itemEyebrow(it.tag, ITEMS[k].w)}</p><h3>${it.name}</h3><p>${it.desc}</p><p class="note">${it.fixed || L.settable}</p><button class="choice primary" id="closeSheet"><span class="c-label">${L.backToRoad}</span></button></div>`;
  sheet.hidden = false;
  const close = () => { sheet.hidden = true; };
  document.getElementById("closeSheet").onclick = close;
  sheet.onclick = e => { if (e.target === sheet) close(); };

/* ---------- Walking between scenes ---------- */
function walk(next) {
  const b = burden();
  const light = b <= 3;
  const near = S.connection >= 4;
  S.maxT = 0; S.time = 0;
  S.walking = true;
  const dur = reduced ? 700 : 1700 + b * 400;
  view({ eyebrow: L.walkEyebrow, title: L.walkTitle,
    body: [b <= 2 ? L.walk1 : b <= 4 ? L.walk2 : L.walk3],
    note: [light ? L.walkNote : "", near ? L.walkHer : ""].filter(Boolean).join("<br>") });
  setTimeout(() => {
    S.walking = false;
    if (light) S.energy = Math.min(S.maxE, S.energy + 1);
    if (near) giveE(1);
    next();
  }, dur);
}

/* ---------- Title ---------- */
function titleScreen() {
  resetState(); setScene("title");
  const html = `<div class="langs" role="group" aria-label="${L.langLabel}">${LANGS.map(([k, n]) => `<button lang="${k}" data-l="${k}" class="${k === lang ? "sel" : ""}" aria-pressed="${k === lang}">${n}</button>`).join("")}</div>`;
  view({ big: L.title, tagline: L.tagline, body: [L.intro], html,
    choices: [{ label: L.start, primary: true, onPick: scene1 }] });
  panel.querySelectorAll(".langs button").forEach(b => b.onclick = () => { setLang(b.dataset.l); titleScreen(); });
}

/* ---------- Scene 1: The Road Ahead ---------- */
function scene1() {
  resetState(); setScene("road");
  S.ground = ["laptop", "lantern", "ember", "thread"];
  view({ eyebrow: L.s1, title: L.s1Title, body: [L.s1b1, L.s1b2], quote: L.s1Quote,
    choices: [{ label: L.startWalking, primary: true, onPick: () => pickup() }] });
}
function pickup(last) {
  const done = S.ground.length === 0;
  const html = '<div class="items">' + ["laptop", "lantern", "ember", "thread"].map(k => {
    const got = S.carried[k];
    return `<button class="item${got ? " got" : ""}" data-k="${k}"${got ? " disabled" : ""} style="--tint:${TINT[k]}"><span class="ico">${ICON[k]}</span><span><b>${L.items[k].name}</b><small>${got ? L.inPack : L.tapPick}</small></span></button>`;
  }).join("") + "</div>";
  const body = last ? [`<b>${L.items[last].name}</b> · ${L.items[last].tag}. ${L.items[last].desc}`] : [L.pickIntro];
  view({ eyebrow: L.s1, title: done ? L.pickFull : L.pickTitle, body, html,
    choices: done ? [{ label: L.keepWalking, primary: true, onPick: clockBeat }] : [] });
  panel.querySelectorAll(".item").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    S.carried[k] = true;
    S.ground = S.ground.filter(x => x !== k);

  });
}
function clockBeat() {
  S.carried.clock = true;
  view({ eyebrow: L.s1, title: L.clockTitle, body: [L.clockBody, L.items.clock.desc], note: L.clockNote(burden()),
    choices: [{ label: L.toMountain, primary: true, onPick: () => walk(scene2) }] });
}

/* ---------- Scene 2: The Mountain of Almost ---------- */
function scene2() {
  setScene("mountain");
  S.maxT = 4; S.time = 4; S.solved = 0; S.goodSpark = Math.floor(Math.random() * 3);
  S.tried = []; S.easyTaken = false; S.ridge = false;
  view({ eyebrow: L.s2, title: L.s2Title, body: [L.s2b1, L.s2b2],
    choices: [{ label: L.startClimb, primary: true, onPick: mountainHub }] });
}
function mountainHub() {
  if (S.time <= 0) return mountainEnd();
  const choices = [{ label: S.solved ? L.nextGap : L.workPath, sub: S.solved ? L.nextGapSub : L.workPathSub, cost: cost(1, 1), onPick: puzzleStart }];
  if (!S.easyTaken) choices.push({ label: L.easy, sub: L.easySub, cost: cost(1, 1),
    onPick: () => { spend(ecost(1), 1); S.easyTaken = true; S.progress += 1;
      outcome({ eyebrow: L.s2short, title: L.steadyT, body: [L.steadyB], then: mountainHub }); } });
  if (S.tried.length < 3 && !S.ridge) choices.push({ label: L.spark, sub: L.sparkSub, cost: cost(2, 1), onPick: sparkPick });
  choices.push({ label: L.stop, sub: L.stopSub, onPick: mountainEnd });
  const busy = S.solved || S.easyTaken || S.tried.length;
  view({ eyebrow: L.s2, title: busy ? L.stillClimbing : L.waysUp, body: [L.timeRoom(S.time)], choices });
}
const GLYPHS = ["{ }", "( )", "</>", "=>", ";", "[ ]"];
function puzzleStart() {
  spend(ecost(1), 1);
  const len = Math.min(3 + S.solved, 6);
  const seq = [];
  while (seq.length < len) { const n = Math.floor(Math.random() * 6); if (n !== seq[seq.length - 1]) seq.push(n); }
  const html = `<p class="puz-status" id="pz">${L.watch}</p><div class="stones">${GLYPHS.map((g, i) => `<button class="stone" data-i="${i}" disabled>${g}</button>`).join("")}</div>`;
  view({ eyebrow: L.mapEyebrow, title: L.gapTitle(len), html });
  const stones = [...panel.querySelectorAll(".stone")];
  const status = document.getElementById("pz");
  let i = 0;
  const step = reduced ? 900 : 650;
  const play = () => {
    if (i >= seq.length) { stones.forEach(s => s.disabled = false); status.textContent = L.yourTurn; return; }
    const s = stones[seq[i]];
    s.classList.add("lit");
    setTimeout(() => { s.classList.remove("lit"); i++; setTimeout(play, 180); }, step);
  };
  setTimeout(play, 600);
  let pos = 0;
  stones.forEach(s => s.onclick = () => {
    const n = +s.dataset.i;
    if (n === seq[pos]) {
      s.classList.add("lit"); setTimeout(() => s.classList.remove("lit"), 220);
      pos++;
      if (pos === seq.length) {
        stones.forEach(x => x.disabled = true);
        S.solved++; S.progress += 1;
        setTimeout(() => outcome({ eyebrow: L.mapEyebrow, title: L.works, body: [L.worksB1, L.worksB2], then: mountainHub }), 400);
      }
    } else {
      s.classList.add("bad");
      stones.forEach(x => x.disabled = true);
      setTimeout(() => outcome({ eyebrow: L.mapEyebrow, title: L.almost, body: [L.almostB1, L.almostB2], then: mountainHub }), 500);
    }
  });
}
function sparkPick() {
  const html = `<div class="sparks">${[0, 1, 2].map(i => `<button class="spark" data-i="${i}" aria-label="${L.sparkAria(i + 1)}"${S.tried.includes(i) ? " disabled" : ""}></button>`).join("")}</div>`;
  view({ eyebrow: L.lanternEyebrow, title: L.pickSpark, body: [L.pickSparkBody], html,
    note: cost(2, 1).replace(/<[^>]+>/g, ""), choices: [{ label: L.back, onPick: mountainHub }] });
  panel.querySelectorAll(".spark").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    spend(ecost(2), 1); S.tried.push(i);
    if (i === S.goodSpark) {
      S.ridge = true; S.progress += 3;
      outcome({ eyebrow: L.lanternEyebrow, title: L.ridgeT, body: [L.ridgeB1, L.ridgeB2], then: mountainHub });
    } else {
      outcome({ eyebrow: L.lanternEyebrow, title: L.nowhereT, body: [L.nowhereB1, L.nowhereB2], then: mountainHub });
    }
  });
}
function mountainEnd() {
  S.maxT = 0;
  view({ eyebrow: L.s2, title: L.eveT, body: [S.progress >= 4 ? L.eveGood : L.eveLess], quote: L.s2Quote,
    choices: [{ label: L.cont, primary: true, onPick: () => proceed(message1) }] });
}

/* ---------- Messages ---------- */

}

  view({ eyebrow: L.thread, html: chat([["her", q]]), note: L.whatDo,
    choices: [
      { label: L.m1a, sub: L.m1aSub, onPick: () => {
        S.connection = Math.max(0, S.connection - 1);
        reply1([["her", q], ["me", L.m1aMe], ["her", L.m1aHer], ["sys", L.m1aSys]]); } },
      { label: L.m1b, sub: L.m1bSub, cost: L.plusE(2), onPick: () => {
        giveE(2); S.comms++; S.connection += 1;
        reply1([["her", q], ["me", L.m1bMe], ["her", L.m1bHer], ["sys", L.m1bSys], ["sys", L.lighter]]); } },
      { label: L.m1c, sub: L.m1cSub, cost: L.plusE(1), onPick: () => {
        S.energy = Math.min(S.maxE, S.energy + 1); S.promise = true;
        reply1([["her", q], ["me", L.m1cMe], ["her", L.m1cHer], ["sys", L.m1cSys]]); } }
    ] });
}
function reply1(lines) {
  view({ eyebrow: L.thread, html: chat(lines), reveal: true,
    choices: [{ label: L.toShelter, primary: true, onPick: () => proceed(() => shelter(() => walk(scene3))) }] });
}
function message2() {
  const q = L.m2q;
  const choices = [];
  if (S.promise) choices.push({ label: L.m2p, sub: L.m2pSub, cost: L.plusE(2), onPick: () => {
    giveE(2); S.comms++; S.connection += 2; S.promiseKept = true;
    reply2([["her", q], ["me", L.m2pMe], ["her", L.m2pHer], ["sys", L.m2pSys], ["sys", L.lighter]]); } });
  else choices.push({ label: L.m2b, sub: L.m2bSub, cost: L.plusE(2), onPick: () => {
    giveE(2); S.comms++; S.connection += 1;
    reply2([["her", q], ["me", L.m2bMe], ["her", L.m2bHer], ["sys", L.m2bSys], ["sys", L.lighter]]); } });
  choices.push({ label: L.m2a, sub: L.m2aSub, onPick: () => {
    S.connection = Math.max(0, S.connection - 1);
    const lines = [["her", q], ["me", L.m2aMe], ["her", L.m2aHer], ["sys", L.m2aSys]];
    if (S.promise) lines.push(["sys", L.m2aPromise]);

  view({ eyebrow: L.thread, html: chat([["her", q]]), note: L.whatDo, choices });

function reply2(lines) {
  view({ eyebrow: L.thread, html: chat(lines), reveal: true,
    choices: [{ label: L.toShelter, primary: true, onPick: () => proceed(() => shelter(() => walk(scene4))) }] });
}

/* ---------- Shelter ---------- */
function shelter(next) {
  const choices = [];
  ["laptop", "lantern", "ember"].filter(k => S.carried[k]).forEach(k => choices.push({
    label: L.setDown(nm(k)), sub: L.hint[k], keep: true, cost: L.packMinus(ITEMS[k].w),
    onPick: () => { S.carried[k] = false; S.shelter.push(k); S.setDown++; shelterDone(next, L.setDownDone(nm(k))); } }));
  S.shelter.forEach(k => choices.push({
    label: L.pickUp(nm(k)), sub: L.waited, cost: L.packPlus(ITEMS[k].w),
    onPick: () => { S.carried[k] = true; S.shelter = S.shelter.filter(x => x !== k); shelterDone(next, L.pickUpDone(nm(k))); } }));
  choices.push({ label: L.rest, sub: L.restSub, cost: L.plusE(2),
    onPick: () => { S.energy = Math.min(S.maxE, S.energy + 2); S.rested++; shelterDone(next, L.restDone); } });
  choices.push({ label: L.hold, sub: L.holdSub, cost: L.holdCost,
    onPick: () => { giveE(2); S.connection += 1; shelterDone(next, L.holdDone); } });
  view({ eyebrow: L.shEyebrow, title: L.shTitle, body: [L.shB1, L.shB2], note: L.shNote, choices });
}
function shelterDone(next, text) {
  outcome({ eyebrow: L.shEyebrow, title: L.shTitle, body: [text], then: next, label: L.backOnRoad });
}

/* ---------- Scene 3: The Workshop in the Rain ---------- */
function scene3() {
  setScene("workshop");
  S.maxT = 2; S.time = 2;
  view({ eyebrow: L.s3, title: L.s3Title, body: [L.s3b1, S.carried.ember ? L.s3bEmber : L.s3bNoEmber, L.s3b3],
    choices: [{ label: L.goInside, primary: true, onPick: workshopHub }] });
}
function workshopHub() {
  if (S.time <= 0) return workshopEnd();
  const ember = S.carried.ember;
  const choices = [
    { label: L.improve, sub: ember ? L.improveSub : L.improveNo, cost: cost(2, 1), disabled: !ember,
      onPick: () => { spend(ecost(2), 1); S.craft++;
        outcome({ eyebrow: L.s3short, title: S.craft > 1 ? L.craftT2 : L.craftT1,
          body: [S.craft > 1 ? L.craftB2 : L.craftB1, L.craftRain], then: workshopHub }); } },
    { label: L.customers, sub: L.customersSub, cost: cost(2, 1),
      onPick: () => { spend(ecost(2), 1);
        const hit = Math.random() < 0.3 + 0.3 * S.craft;
        if (hit) S.customers++;
        outcome({ eyebrow: L.s3short, title: hit ? L.hitT : L.missT,
          body: hit ? [L.hitB1, L.hitB2] : [L.missB1, L.missB2], then: workshopHub }); } },
    { label: L.leave, sub: L.leaveSub, cost: L.leaveCost,
      onPick: () => { S.time = 0; S.progress += 1;
        outcome({ eyebrow: L.s3short, title: L.leaveT, body: [L.leaveB], then: workshopEnd }); } }
  ];
  view({ eyebrow: L.s3, title: L.leftToday(S.time), body: [L.twoNotThree], choices });
}
function workshopEnd() {
  S.maxT = 0;
  view({ eyebrow: L.s3, title: L.closingT, body: [L.came(S.customers)], quote: L.s3Quote,
    choices: [{ label: L.cont, primary: true, onPick: () => proceed(message2) }] });
}

/* ---------- Scene 4: The Bridge of Two Skies ---------- */
function scene4() {
  setScene("bridge");
  S.herX = 0.82; S.lanternFade = S.carried.lantern ? 1 : 0;
  view({ eyebrow: L.s4, title: L.s4Title,
    body: [L.s4b1, S.carried.lantern ? L.s4bLantern : L.s4bNoLantern, L.s4b3],
    choices: [
      { label: L.work, sub: L.workSub, cost: cost(2, 0), onPick: () => {
        spend(ecost(2)); S.bridge = "work"; S.progress += 2; S.connection = Math.max(0, S.connection - 1); S.lanternFade = 0;
        bridgeOut(L.workT, [L.workB1, L.workB2]); } },
      { label: L.cross, sub: L.crossSub, cost: L.plusE(2), onPick: () => {
        giveE(2); S.bridge = "cross"; S.connection += 2; S.progress = Math.max(0, S.progress - 1); S.lanternFade = 0; S.herX = 0.4;
        bridgeOut(L.crossT, [L.crossB1, L.crossB2]); } },
      { label: L.msg, sub: L.msgSub, cost: L.plusE(1), onPick: () => {
        giveE(1); S.bridge = "message"; S.comms++; S.connection += 1; S.progress += 1; S.lanternFade = 0;
        bridgeOut(L.msgT, [L.msgB1, L.msgB2, L.msgB3]); } }
    ] });
}
function bridgeOut(title, body) {
  view({ eyebrow: L.s4, title, body, quote: L.s4Quote,
    choices: [{ label: L.toHill, primary: true, onPick: () => proceed(() => walk(scene5)) }] });
}

/* ---------- Scene 5 + endings ---------- */
function scene5() {
  setScene("hill");
  S.herX = S.bridge === "work" ? null : 0.4;
  const carried = ["laptop", "lantern", "ember"].filter(k => S.carried[k]).map(nm);
  const left = S.shelter.map(nm);
  const body = [L.s5b1, carried.length === 3 ? L.s5All : L.s5Carry(carried, left, L.join),
    S.bridge === "message" ? L.s5Msg : S.bridge === "cross" ? L.s5Cross : L.s5Work];
  view({ eyebrow: L.s5, title: L.s5Title, body, choices: [{ label: L.lookOut, primary: true, onPick: ending }] });
}
function ending() {
  let key;
  if (S.comms >= 2 && S.bridge !== "work") key = "C";
  else if (S.setDown >= 1 || S.rested >= 1) key = "B";
  else key = "A";
  const E = L.endings[key];
  const html = `<div class="tally"><div><b>${S.progress}</b><span>${L.tally1}</span></div><div><b>${S.comms}</b><span>${L.tally2}</span></div><div><b>${S.setDown + S.rested}</b><span>${L.tally3}</span></div></div>`;
  view({ eyebrow: L.endingEyebrow(key), title: E.name, body: [L.madeIt, ...E.body], html,
    choices: [{ label: L.cont, primary: true, onPick: threadScreen }] });
}
function threadScreen() {
  S.connection = Math.max(S.connection, 4);
  view({ eyebrow: L.items.thread.name, title: L.threadT,
    body: [L.threadB1, S.fromHer > 0 ? L.threadB2(S.fromHer) : L.threadB2none], quote: L.threadQuote,
    choices: [{ label: L.readLast, primary: true, onPick: finalLine }] });
}
function finalLine() {
  view({ eyebrow: L.title, bigQuote: L.finalQuote,
    choices: [{ label: L.oneMore, primary: true, onPick: letter }] });
}
function letter() {
  const C = CONFIG[lang] || CONFIG.en;
  const html = `<p class="letter">${C.note}</p><p class="sign">${C.signoff}</p>`;
  view({ eyebrow: L.forYou, html, choices: [{ label: L.again, onPick: titleScreen }] });
}

/* ---------- World rendering ---------- */
const PAL = {
  title:    { top: "#120f2b", mid: "#2e2453", hor: "#a8606e", glow: "#f6c27a", h1: "#3a2d5e", h2: "#2a2148", h3: "#17122e", a1: 26, a2: 18, a3: 6, peak: 0, city: 0.25, house: 0, bridge: 0, rain: 0 },
  road:     { top: "#120f2b", mid: "#30255a", hor: "#b0646f", glow: "#f6c27a", h1: "#3c2e60", h2: "#2a2149", h3: "#17122e", a1: 22, a2: 14, a3: 5, peak: 0, city: 0.2, house: 0, bridge: 0, rain: 0 },
  mountain: { top: "#0e1029", mid: "#262c54", hor: "#6f6496", glow: "#f3c98a", h1: "#3b3a6b", h2: "#272852", h3: "#141631", a1: 30, a2: 22, a3: 7, peak: 1, city: 0, house: 0, bridge: 0, rain: 0 },
  workshop: { top: "#0c1120", mid: "#1f2a44", hor: "#4a5874", glow: "#e8a860", h1: "#2c3854", h2: "#1f2840", h3: "#101828", a1: 16, a2: 10, a3: 4, peak: 0, city: 0, house: 1, bridge: 0, rain: 1 },
  bridge:   { top: "#17112f", mid: "#3a2858", hor: "#c0717f", glow: "#f7c88a", h1: "#4a3466", h2: "#30234c", h3: "#1a1432", a1: 20, a2: 26, a3: 4, peak: 0, city: 0.15, house: 0, bridge: 1, rain: 0 },
  hill:     { top: "#1b1842", mid: "#4b3472", hor: "#e2896f", glow: "#ffd59a", h1: "#5a3f78", h2: "#3a2a58", h3: "#1f1838", a1: 14, a2: 10, a3: 16, peak: 0, city: 1, house: 0, bridge: 0, rain: 0 }
};
let scene = "title", fromPal = PAL.title, toPal = PAL.title, mixT = 1;
function currentPal() {
  const t = mixT, o = {};
  for (const k in toPal) {
    const a = fromPal[k], b = toPal[k];
    o[k] = typeof b === "number" ? a + (b - a) * t : mixHex(a, b, t);
  }
  return o;
}
function setScene(k) { fromPal = currentPal(); toPal = PAL[k]; mixT = 0; scene = k; if (k !== "bridge" && k !== "hill") S.herX = null; }
function hex(c) {
  if (c.startsWith("rgb")) return c.match(/\d+/g).map(Number);
  const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }

const cv = document.getElementById("world"), cx = cv.getContext("2d");
let W = 0, H = 0;
function resize() {
  const d = Math.min(2, devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", resize);
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + 0.3, p: Math.random() * 6 }));
const drops = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.6 }));

let offset = 0, phase = 0, last = performance.now();
function ridge(x, base, amp, seed, peak, peakX) {
  let y = base - amp * (Math.sin(x * 0.006 + seed) * 0.6 + Math.sin(x * 0.017 + seed * 2.1) * 0.3 + Math.sin(x * 0.041 + seed * 3.7) * 0.1);
  if (peak) { const d = (x - peakX) / (W * 0.16); y -= peak * Math.exp(-d * d); }
  return y;
}
function layer(base, amp, seed, par, color, peak, peakXr) {
  cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) cx.lineTo(x, ridge(x + offset * par, base, amp, seed, peak, W * peakXr + offset * par));
  cx.lineTo(W, H); cx.closePath(); cx.fillStyle = color; cx.fill();
}
function figure(x, y, s, opts) {
  const { walking, pack, lean, rim } = opts;
  cx.save(); cx.translate(x, y); cx.rotate(lean);
  const sw = walking ? Math.sin(phase) * 6 * s : 0;
  const bob = walking ? Math.abs(Math.sin(phase)) * 1.5 * s : 0;
  cx.translate(0, -bob);
  cx.strokeStyle = "#0b0918"; cx.lineCap = "round"; cx.lineWidth = 4 * s;
  cx.beginPath(); cx.moveTo(0, -26 * s); cx.lineTo(sw, 0); cx.moveTo(0, -26 * s); cx.lineTo(-sw, 0); cx.stroke();
  if (pack) {
    const pw = (5 + pack * 1.6) * s, ph = (12 + pack * 2.2) * s;
    cx.fillStyle = "#151129"; cx.beginPath();
    cx.roundRect ? cx.roundRect(-4 * s - pw, -50 * s, pw, ph, 3 * s) : cx.rect(-4 * s - pw, -50 * s, pw, ph);
    cx.fill();
    cx.strokeStyle = rgba(rim, 0.25); cx.lineWidth = 1; cx.stroke();
  }
  cx.fillStyle = "#0b0918"; cx.beginPath();
  cx.moveTo(-5 * s, -26 * s); cx.lineTo(5 * s, -26 * s); cx.lineTo(4 * s, -52 * s); cx.lineTo(-4 * s, -52 * s); cx.closePath(); cx.fill();
  cx.beginPath(); cx.arc(0.5 * s, -59 * s, 6 * s, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = rgba(rim, 0.35); cx.lineWidth = 1; cx.stroke();
  cx.restore();
}
function glow(x, y, r, color, a) {
  const g = cx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0));
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mixT < 1) mixT = Math.min(1, mixT + dt / 1.2);
  const P = currentPal(), b = burden();
  if (S.walking) { offset += dt * (90 / (1 + b * 0.18)); phase += dt * (7 / (1 + b * 0.12)); }
  const t = now / 1000;
  const pr = panel.getBoundingClientRect(), cr = cv.getBoundingClientRect();
  const gy = clamp(Math.min(H * 0.58, pr.top - cr.top - 26), H * 0.3, H * 0.62);
  const hy = gy * 0.6;
  const s = clamp(H / 760, 0.75, 1.25);

  const sky = cx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, P.top); sky.addColorStop(0.55, P.mid); sky.addColorStop(1, P.hor);
  cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
  stars.forEach(st => {
    const a = (reduced ? 0.6 : 0.4 + 0.4 * Math.sin(t * 1.3 + st.p)) * (1 - P.rain * 0.8);
    cx.fillStyle = `rgba(255,246,230,${a})`; cx.beginPath(); cx.arc(st.x * W, st.y * hy * 0.95, st.r, 0, Math.PI * 2); cx.fill();
  });
  const lx = W * 0.72, ly = hy + 4;
  glow(lx, ly, Math.max(W, H) * 0.42, P.glow, 0.32);
  glow(lx, ly, 26 * s, P.glow, 0.9);
  cx.fillStyle = rgba(P.glow, 1); cx.beginPath(); cx.arc(lx, ly, 3.2 * s, 0, Math.PI * 2); cx.fill();
  if (P.city > 0.01) {
    let seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let x = lx - 110 * s; x < lx + 110 * s; x += 9 * s) {
      const hgt = (6 + rnd() * 26) * s * (1 - Math.abs(x - lx) / (130 * s));
      cx.fillStyle = rgba(P.h1, P.city); cx.fillRect(x, ly - hgt, 8 * s, hgt + 6);
      if (rnd() > 0.5) { cx.fillStyle = rgba(P.glow, 0.8 * P.city); cx.fillRect(x + 3 * s, ly - hgt * 0.6, 1.6 * s, 1.6 * s); }
    }
  }
  layer(hy + 10, P.a1, 1.3, 0.12, P.h1, P.peak * (gy - hy) * 1.4, 0.48);
  layer(hy + (gy - hy) * 0.5, P.a2, 4.1, 0.3, P.h2, 0, 0);
  layer(gy + 6 * s, P.a3, 8.7, 0.7, P.h3, 0, 0);

  const tx = W * 0.26;
  const ty = ridge(tx + offset * 0.7, gy + 6 * s, P.a3, 8.7, 0, 0);

  if (P.bridge > 0.01) {
    const x0 = W * 0.48, x1 = W * 0.76;
    const ch = cx.createLinearGradient(0, ty, 0, H);
    ch.addColorStop(0, rgba(P.h2, P.bridge)); ch.addColorStop(1, rgba(P.top, P.bridge));
    cx.fillStyle = ch; cx.fillRect(x0, ty - 2, x1 - x0, H);
    cx.strokeStyle = rgba("#0b0918", P.bridge); cx.lineWidth = 3 * s;
    cx.beginPath(); cx.moveTo(x0 - 10, ty); cx.quadraticCurveTo((x0 + x1) / 2, ty + 18 * s, x1 + 10, ty); cx.stroke();
    cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(x0 - 10, ty - 14 * s); cx.quadraticCurveTo((x0 + x1) / 2, ty + 4 * s, x1 + 10, ty - 14 * s); cx.stroke();
    for (let i = 0; i <= 8; i++) {
      const u = i / 8, bx = x0 + (x1 - x0) * u, by = ty + 18 * s * 4 * u * (1 - u) * 0.5;
      cx.beginPath(); cx.moveTo(bx, by); cx.lineTo(bx, by - 13 * s); cx.stroke();
    }
  }
  if (P.house > 0.01) {
    const hx = W * 0.6, hw = 54 * s, hh = 38 * s, hb = ty + 2;
    cx.globalAlpha = P.house;
    cx.fillStyle = "#0e1220"; cx.fillRect(hx, hb - hh, hw, hh);
    cx.beginPath(); cx.moveTo(hx - 6 * s, hb - hh); cx.lineTo(hx + hw / 2, hb - hh - 20 * s); cx.lineTo(hx + hw + 6 * s, hb - hh); cx.fill();
    const lit = (S.carried.ember ? 0.35 : 0.08) + 0.25 * S.craft;
    glow(hx + 15 * s, hb - 20 * s, 30 * s, "#ffb066", lit * 0.6);
    cx.fillStyle = rgba("#ffb066", Math.min(1, lit + 0.1)); cx.fillRect(hx + 9 * s, hb - 26 * s, 12 * s, 10 * s);
    cx.fillStyle = "#1a1f33"; cx.fillRect(hx + 32 * s, hb - 22 * s, 11 * s, 22 * s);
    for (let i = 0; i < S.customers; i++) figure(hx + hw + 14 * s + i * 12 * s, hb, s * 0.75, { rim: "#ffb066", lean: 0 });
    cx.globalAlpha = 1;
  }

  if (scene === "road") S.ground.forEach((k, i) => {
    const ox = W * (0.42 + i * 0.13), oy = ty - 22 * s + Math.sin(t * 2 + i) * 4 * s;
    glow(ox, oy, 22 * s, TINT[k], 0.5);
    cx.fillStyle = TINT[k]; cx.beginPath(); cx.arc(ox, oy, 3.5 * s, 0, Math.PI * 2); cx.fill();
  });

  let herPos = null;
  if (S.herX != null && (scene === "bridge" || scene === "hill")) {
    const hx = W * S.herX;
    const hyy = ridge(hx + offset * 0.7, gy + 6 * s, P.a3, 8.7, 0, 0);
    herPos = [hx, hyy];
    glow(hx, hyy - 30 * s, 40 * s, "#e9c46a", 0.35);
    cx.save(); cx.translate(hx, 0); cx.scale(-1, 1); cx.translate(-hx, 0);
    figure(hx, hyy, s * 0.95, { rim: "#e9c46a", lean: 0 });
    cx.restore();
  }

  if (S.carried.thread) {
    const sx = tx - 8 * s, sy = ty - 44 * s;
    const ex = herPos ? herPos[0] - 4 * s : lx, ey = herPos ? herPos[1] - 40 * s : ly;
    const a = clamp(0.18 + S.connection * 0.11, 0.12, 0.9);
    cx.strokeStyle = rgba("#e9c46a", a); cx.lineWidth = 1 + S.connection * 0.15;
    cx.beginPath(); cx.moveTo(sx, sy);
    cx.quadraticCurveTo((sx + ex) / 2, Math.min(sy, ey) - 40 * s + Math.sin(t * 0.9) * 8 * s, ex, ey); cx.stroke();
  }
  const lean = Math.min(0.14, b * 0.016) + (S.walking ? 0.03 : 0);
  if (S.carried.lantern) {
    let la = scene === "bridge" && S.bridge == null ? 0.25 + 0.25 * Math.abs(Math.sin(t * 7) * Math.sin(t * 2.3)) : 0.55;
    if (scene === "bridge" && S.bridge === "cross") la = 0.05;
    glow(tx + 11 * s, ty - 30 * s, 30 * s, "#f2d27a", la);
  }
  figure(tx, ty, s, { walking: S.walking, pack: scene === "title" ? 0 : b, lean, rim: P.glow });
  if (S.carried.ember) glow(tx - 12 * s, ty - 38 * s, 9 * s, "#ff9a5a", 0.8);
  if (S.carried.laptop) glow(tx - 14 * s, ty - 46 * s, 7 * s, "#8fb8ff", 0.7);

  if (P.rain > 0.01) {
    cx.strokeStyle = `rgba(190,205,235,${0.35 * P.rain})`; cx.lineWidth = 1;
    cx.beginPath();
    drops.forEach(d => {
      if (!reduced) { d.y += dt * d.s * 1.1; if (d.y > 1) { d.y = 0; d.x = Math.random(); } }
      const x = d.x * W, y = d.y * H;
      cx.moveTo(x, y); cx.lineTo(x - 2, y + 12 * d.s);
    });
    cx.stroke();
  }
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
function initialLang() {
  const h = location.hash.slice(1);
  if (T[h]) return h;
  try { const s = localStorage.getItem("ttic-lang"); if (T[s]) return s; } catch (e) {}
  return "en";
}
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (T[h] && h !== lang) { setLang(h); if (scene === "title") titleScreen(); }
});
setLang(initialLang());
resize();
titleScreen();
requestAnimationFrame(frame);
</script>
